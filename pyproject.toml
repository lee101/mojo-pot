[project]
name = "mojo-pot"
version = "0.1.0"
description = "Optimal transport solvers implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "optimal-transport", "sinkhorn", "earth-mover-distance"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "POT"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
